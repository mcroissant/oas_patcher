overlay: 1.0.0
info:
  title: Base Overlay
  version: 1.0.0
actions:
  - target: "$.info"
    update:
      title: "{{ app_name }}"
      version: "{{ api_version }}"
      description: "{{ app_name }} - Base configuration"
  - target: "$.servers"
    remove: true
  - target: "$"
    update:
      servers:
        - url: "{{ base_url }}"
          description: "{{ environment }} server"
